[package]
name = "wipple"
version = "0.1.0"
description = "A composed desktop companion for Windows"
authors = ["Wipple"]
edition = "2021"

[lib]
name = "wipple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
